name: deploy
# Builds the page and publishes it. A deploy uses the newest report: the `report.json` asset of the
# `progress` release when it exists (bof3-decomp uploads it after each merge and dispatches this
# workflow), else the committed data/report.json. A pull request only runs the checks on the
# committed report. Every pull request runs `build`, because the main ruleset requires it.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
  # Backstop: check hourly whether the progress release is newer than the page; the `fresh` job
  # ends the run when the published report is the one already deployed.
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
            gh release download progress -R "$GITHUB_REPOSITORY" -p report.json -O release.json &&
            curl -fsS "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/report.json" -o deployed.json &&
            cmp -s release.json deployed.json; then
            changed=false
            echo "The deployed report is the published one; nothing to do"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
  build:
    needs: fresh
    if: needs.fresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Use the newest published report
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download progress -R "$GITHUB_REPOSITORY" -p report.json -O data/report.json --clobber; then
            echo "Using the report of the progress release"
          else
            echo "No progress release; using the committed data/report.json"
          fi
      - uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6
        with:
          cache: true
      - name: Type check
        run: npm run lint
      - name: Check dependency licences
        run: npm run licenses
      # The build copies data/report.json into site/ and renders the pictures from it.
      - name: Build the page and the pictures
        run: npm run build
      - name: Test the model and the built site
        run: npm test
      - name: Check the site names only public projects
        run: |
          bad=$(grep -rhoE 'github\.com/raulcorreia7/[A-Za-z0-9._-]+' site data/report.json \
            | sed -E 's#^github\.com/raulcorreia7/##' | sort -u \
            | grep -vE '^(bof3-status|bof3-player)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These repositories are not public yet; remove them from the site:"
            printf '%s\n' "$bad"
            exit 1
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
